name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.47.2"
          cache: true

      - run: flutter pub get

      - name: Static analysis
        run: flutter analyze lib test tool

      - name: Tests
        run: flutter test

      - name: Generated localizations are up to date
        run: |
          flutter gen-l10n
          git diff --exit-code -- lib/l10n

      - name: Build release APK
        run: flutter build apk --release

      - name: Release APK must not request network access
        run: |
          AAPT2=$(ls "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -1)
          PERMISSIONS=$("$AAPT2" dump permissions build/app/outputs/flutter-apk/app-release.apk)
          echo "$PERMISSIONS"
          if echo "$PERMISSIONS" | grep -Eq 'INTERNET|ACCESS_NETWORK_STATE'; then
            echo "::error::The release APK declares a network permission"
            exit 1
          fi
